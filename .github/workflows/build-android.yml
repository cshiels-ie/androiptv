# Builds the Android APK on GitHub's runners so nothing heavy ever has to
# compile on a dev device. Produces an arm64-v8a APK artifact plus the
# ffmpeg sidecar (built from source, minimal component set — the app only
# remuxes TS → HLS with `-c copy`, so no encoders/decoders are needed).
#
# Note on http vs https: the minimal ffmpeg build omits a TLS backend, so
# raw-TS channels over https fall back to the in-app error path; HLS
# channels are unaffected (proxied by Rust, no ffmpeg involved).

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build ffmpeg for Android (aarch64, minimal static)
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ./configure \
            --prefix="$GITHUB_WORKSPACE/ffmpeg-out" \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cc="$NDK_BIN/aarch64-linux-android26-clang" \
            --ar="$NDK_BIN/llvm-ar" \
            --nm="$NDK_BIN/llvm-nm" \
            --ranlib="$NDK_BIN/llvm-ranlib" \
            --strip="$NDK_BIN/llvm-strip" \
            --disable-everything \
            --enable-ffmpeg \
            --disable-ffprobe \
            --disable-ffplay \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-demuxer=mpegts \
            --enable-muxer=hls \
            --enable-muxer=mpegts \
            --enable-parser=aac,h264,hevc,mpeg4video,mpegvideo,mpegaudio \
            --enable-protocol=file,http,tcp \
            --enable-bsfs \
            --enable-pthreads \
            --enable-small \
            --disable-doc \
            --disable-debug
          make -j"$(nproc)"
          make install
          cp "$GITHUB_WORKSPACE/ffmpeg-out/bin/ffmpeg" \
             "$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-aarch64-linux-android"

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Patch AndroidManifest (INTERNET + cleartext HTTP)
        run: |
          python3 - <<'EOF'
          import re
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          if "usesCleartextTraffic" in s:
              s = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  s,
              )
          else:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          open(p, "w").write(s)
          EOF

      - name: Build APK (arm64-v8a)
        run: npm run tauri android build -- --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androiptv-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
