# Builds the Android APK(s)/AAB(s) on GitHub's runners so nothing heavy ever
# has to compile on a dev device. The ffmpeg sidecar is built from source
# (minimal component set — remux only): video is copied untouched, audio is
# decoded and re-encoded to AAC (aac/ac3/eac3/mp3 decoders), the matroska/
# mov demuxers cover VOD files, and a bundled openssl provides https so
# https raw-TS/VOD URLs remux instead of failing at input-open.
#
# Manual runs (Actions → "Build Android APK" → Run workflow) can pick the
# ABI(s) and package type; pull requests build the arm64-v8a APK (the
# standard target).

name: Build Android APK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      abi:
        description: "Android ABI(s) to build"
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64
          - all
        default: aarch64
      package:
        description: "Package type to produce"
        type: choice
        options:
          - apk
          - aab
          - both
        default: apk
      build_type:
        description: "debug = signed with the debug key, sideloads directly (default). release = unsigned, for store signing."
        type: choice
        options:
          - debug
          - release
        default: debug

env:
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # All four ABIs up front: `tauri android build --target` uses the
          # short names, cargo needs the full triples.
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build ffmpeg for Android (minimal static, per ABI)
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Resolve the requested ABIs (empty on pull request → aarch64).
          ABIS="${{ inputs.abi }}"
          [ -z "${ABIS}" ] && ABIS="aarch64"
          [ "${ABIS}" = "all" ] && ABIS="aarch64 armv7 i686 x86_64"

          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          git clone --depth 1 --branch openssl-3.0.13 https://github.com/openssl/openssl.git openssl-src

          # The Android ffmpeg build needs a TLS backend or every https
          # stream URL dies at input-open ("Protocol 'https' not on
          # whitelist"). openssl 3.0's android-* configs locate the NDK
          # toolchain via $ANDROID_NDK_ROOT; the built libs are static.
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # openssl's android targets probe $PATH for the NDK clang
          # (Configurations/15-android.conf): with a clang-only NDK (r23+)
          # and clang missing from $PATH, Configure falls back to probing
          # for a $triarch-gcc wrapper that no longer exists and dies.
          # Put the llvm prebuilt bin dir on PATH so it takes the clang
          # branch and builds with the $triarch$api-clang wrappers (which
          # self-target the API level and sysroot).
          export PATH="$NDK_BIN:$PATH"

          for abi in ${ABIS}; do
            case "${abi}" in
              aarch64) ARCH=aarch64; CPU=armv8-a;      CC=aarch64-linux-android26-clang;  SSL_ARCH=android-arm64 ;;
              armv7)   ARCH=armv7;   CPU=armv7-a;      CC=armv7a-linux-androideabi26-clang; SSL_ARCH=android-arm ;;
              i686)    ARCH=x86;     CPU=i686;         CC=i686-linux-android26-clang;    SSL_ARCH=android-x86 ;;
              x86_64)  ARCH=x86_64;  CPU=x86_64;       CC=x86_64-linux-android26-clang;  SSL_ARCH=android-x86_64 ;;
              *)       echo "unknown ABI: ${abi}"; exit 1 ;;
            esac

            # openssl, per ABI. (Only install_sw is used — libs + headers —
            # so there is no need for the no-apps/no-docs options, which
            # the 3.0 Configure does not accept.)
            cd openssl-src
            make distclean >/dev/null 2>&1 || true
            ./Configure "${SSL_ARCH}" -D__ANDROID_API__=26 \
              --prefix="$GITHUB_WORKSPACE/openssl-out-${abi}" --libdir=lib \
              no-shared no-tests >/dev/null
            make -j"$(nproc)" >/dev/null
            make install_sw >/dev/null
            cd ../ffmpeg-src

            # Mirror ffmpeg configure's C-compiler sanity link (test_ld:
            # ld $LDFLAGS -o $TMPE $TMPO $extralibs) so that if it fails we
            # get clang's full stderr here instead of configure's terse
            # "is unable to create an executable file."
            # Note: no -lpthread — bionic folded pthreads into libc at
            # API 24, so the NDK r26 API-26 sysroot has no libpthread.so
            # and the link fails ("unable to find library -lpthread").
            echo 'int main(void){return 0;}' > "${GITHUB_WORKSPACE}/cc-sanity.c"
            if ! "$NDK_BIN/${CC}" -L"${GITHUB_WORKSPACE}/openssl-out-${abi}/lib" \
                  -o "${GITHUB_WORKSPACE}/cc-sanity" \
                  "${GITHUB_WORKSPACE}/cc-sanity.c" \
                  -lssl -lcrypto -lz -ldl; then
              echo "sanity link failed (see clang errors above)"
              exit 1
            fi

            # One source tree, several configures: distclean resets between ABIs.
            make distclean >/dev/null 2>&1 || true
            # ffmpeg's configure detects openssl via pkg-config (installed on
            # ubuntu-latest) — it must find the per-ABI static install above.
            export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/openssl-out-${abi}/lib/pkgconfig"
            # configure's sanity test can die with a bare "unable to create an
            # executable file" — dump the real compiler stderr in that case.
            set +e
            ./configure \
              --prefix="$GITHUB_WORKSPACE/ffmpeg-out-${abi}" \
              --target-os=android \
              --arch="${ARCH}" \
              --cpu="${CPU}" \
              --enable-cross-compile \
              --cc="$NDK_BIN/${CC}" \
              --ar="$NDK_BIN/llvm-ar" \
              --nm="$NDK_BIN/llvm-nm" \
              --ranlib="$NDK_BIN/llvm-ranlib" \
              --strip="$NDK_BIN/llvm-strip" \
              --disable-everything \
              --enable-ffmpeg \
              --disable-ffprobe \
              --disable-ffplay \
              --enable-avcodec \
              --enable-avformat \
              --enable-avutil \
              --enable-avfilter \
              --enable-swresample \
              --enable-filter=aresample \
              --enable-encoder=aac \
              --enable-demuxer=mpegts,matroska,mov \
              --enable-muxer=hls \
              --enable-muxer=mpegts \
              --enable-decoder=aac,ac3,eac3,mp3 \
              --enable-parser=aac,h264,hevc,mpeg4video,mpegvideo,mpegaudio,ac3,eac3 \
              --enable-protocol=file,http,tcp,https \
              --enable-openssl \
              --extra-cflags="-I$GITHUB_WORKSPACE/openssl-out-${abi}/include" \
              --extra-ldflags="-L$GITHUB_WORKSPACE/openssl-out-${abi}/lib" \
              --extra-libs="-lssl -lcrypto -lz -ldl" \
              --enable-bsfs \
              --enable-pthreads \
              --enable-small \
              --disable-doc \
              --disable-debug
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "=== configure failed (rc=$rc) — ffbuild/config.log tail ==="
              tail -150 ffbuild/config.log 2>/dev/null || true
              exit $rc
            fi
            make -j"$(nproc)"
            make install
            cp "$GITHUB_WORKSPACE/ffmpeg-out-${abi}/bin/ffmpeg" \
               "$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-${abi}-linux-android"
          done

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Patch AndroidManifest (INTERNET + cleartext HTTP)
        run: |
          python3 - <<'EOF'
          import re
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          if "usesCleartextTraffic" in s:
              s = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  s,
              )
          else:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          open(p, "w").write(s)
          EOF

      - name: Build Android packages
        run: |
          set -euxo pipefail
          ABIS="${{ inputs.abi }}"
          [ -z "${ABIS}" ] && ABIS="aarch64"
          [ "${ABIS}" = "all" ] && ABIS="aarch64 armv7 i686 x86_64"
          PACKAGE="${{ inputs.package }}"
          case "${PACKAGE}" in
            aab)  FLAGS="--aab" ;;
            both) FLAGS="--apk --aab" ;;
            *)    FLAGS="--apk" ;;
          esac
          # debug (default) is signed with the debug keystore and sideloads
          # directly; release APKs are unsigned (needs a real keystore).
          # Inputs are empty on pull request triggers — default to debug.
          BUILD_TYPE="${{ inputs.build_type }}"
          [ -z "${BUILD_TYPE}" ] && BUILD_TYPE="debug"
          case "${BUILD_TYPE}" in
            debug) FLAGS="${FLAGS} --debug" ;;
          esac
          for abi in ${ABIS}; do
            # One package per ABI: smaller, sideloadable artifacts.
            npm run tauri android build -- ${FLAGS} --target "${abi}" --split-per-abi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: androiptv-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
