[package]
name = "androiptv"
version = "0.1.0"
description = "Cross-platform IPTV player with an embedded LAN TV server"
edition = "2021"
rust-version = "1.78"

[lib]
name = "androiptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "fs", "io-util", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
regex = "1"
local-ip-address = "0.6"

[profile.release]
codegen-units = 1
lto = true
strip = true
